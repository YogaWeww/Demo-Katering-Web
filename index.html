<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katering Nena - Beranda & Pemesanan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-slate-950 border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-amber-500 p-2 rounded-xl text-slate-950">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">Katering Nena</h1>
                    <p class="text-[10px] text-slate-400">Ekosistem Pre-Order & Katering Kustom</p>
                </div>
            </div>
            <span class="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full text-[10px] font-bold uppercase tracking-wider">
                Klien Aktif S1
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-xl mx-auto px-6 py-8 w-full flex-1">
        
        <!-- Toggle Tabs Section -->
        <div class="grid grid-cols-2 gap-2 mb-6 bg-slate-950 p-1.5 rounded-xl border border-slate-800/80">
            <button id="tab-catalog-btn" class="py-2.5 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow-md">
                <i class="fa-solid fa-book-open mr-1.5"></i>Katalog Menu
            </button>
            <button id="tab-custom-btn" class="py-2.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-100">
                <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>Pesanan Kustom
            </button>
        </div>

        <!-- TAB 1: CATALOG CARD VIEW -->
        <section id="panel-catalog" class="space-y-4">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-fire mr-1 text-orange-400"></i> Paket Populer</h3>
            
            <div id="catalog-list" class="space-y-3">
                <!-- Static Item 1 -->
                <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/80 flex items-center justify-between">
                    <div class="flex items-center gap-3.5">
                        <div class="w-11 h-11 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center text-xl select-none">🍱</div>
                        <div>
                            <h4 class="text-xs font-bold text-slate-100">Nasi Kotak Ayam Bakar</h4>
                            <p class="text-[10px] text-slate-400">Min. order: 15 porsi</p>
                            <p class="text-xs font-bold text-amber-400 mt-1">Rp 25.000/porsi</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 bg-slate-900 rounded-xl p-1.5 border border-slate-800">
                        <button class="w-6 h-6 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center text-xs"><i class="fa-solid fa-minus text-[8px]"></i></button>
                        <span class="text-xs font-bold w-6 text-center select-none">0</span>
                        <button class="w-6 h-6 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center text-xs"><i class="fa-solid fa-plus text-[8px]"></i></button>
                    </div>
                </div>
            </div>

            <!-- Shopping Cart Summary -->
            <div class="mt-6 pt-4 border-t border-slate-800">
                <div class="bg-slate-950 p-5 rounded-3xl border border-slate-800/80 space-y-4 shadow-xl">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-400 font-medium">Ringkasan Belanja</span>
                        <span class="px-2.5 py-0.5 text-[10px] font-extrabold bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/20">0 item</span>
                    </div>
                    <div class="flex justify-between items-center border-b border-slate-900 pb-3">
                        <span class="text-sm font-semibold">Total Harga</span>
                        <span class="text-lg font-black text-amber-400">Rp 0</span>
                    </div>

                    <!-- Client Detail Inputs -->
                    <div class="grid grid-cols-2 gap-3 pt-1">
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1.5 font-medium">Nama Anda:</label>
                            <input type="text" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500 transition-all" placeholder="Masukkan nama Anda">
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-400 mb-1.5 font-medium">Tanggal Pengiriman:</label>
                            <input type="date" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-amber-500 transition-all">
                        </div>
                    </div>

                    <button class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-extrabold rounded-2xl text-xs transition-all shadow-lg shadow-amber-500/10 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cart-shopping"></i> Pesan Sekarang
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 py-6 border-t border-slate-950 mt-12">
        <p class="text-center text-[10px] text-slate-500">© 2026 Katering Nena. Dirancang untuk Demo Portofolio.</p>
    </footer>

</body>
</html>
