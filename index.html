<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katering Nena - Beranda & Pemesanan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <header class="bg-slate-950 border-b border-slate-800/80 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="bg-amber-500 p-2 rounded-xl text-slate-950">
                    <i class="fa-solid fa-utensils text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tight bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">Katering Nena</h1>
                    <p class="text-[10px] text-slate-400">Ekosistem Pre-Order & Katering Kustom</p>
                </div>
            </div>
            <span class="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full text-[10px] font-bold uppercase tracking-wider">
                Klien Aktif S1
            </span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-xl mx-auto px-6 py-8 w-full flex-1">
        
        <!-- Toggle Tabs Section -->
        <div class="grid grid-cols-2 gap-2 mb-6 bg-slate-950 p-1.5 rounded-xl border border-slate-800/80">
            <button id="tab-catalog-btn" class="py-2.5 text-xs font-bold rounded-lg transition-all bg-amber-500 text-slate-950 shadow-md">
                <i class="fa-solid fa-book-open mr-1.5"></i>Katalog Menu
            </button>
            <button id="tab-custom-btn" class="py-2.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-100">
                <i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i>Pesanan Kustom
            </button>
        </div>

        <p class="text-center text-xs text-slate-500 py-12">Kerangka utama berhasil dimuat.</p>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 py-6 border-t border-slate-950 mt-12">
        <p class="text-center text-[10px] text-slate-500">© 2026 Katering Nena. Dirancang untuk Demo Portofolio.</p>
    </footer>

</body>
</html>
